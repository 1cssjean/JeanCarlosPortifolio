# Configurações básicas do site
title: "Seu Nome"
subtitle: "Analista de Dados & Python Developer"
description: "Portfólio de projetos em Python, Power BI, SQL e automação de processos logísticos"
url: "https://jeancarlosportifolio.github.io"
baseurl: ""
repository: "1cssjean/jeancarlosportifolio.github.io"

# Tema
remote_theme: "mmistakes/minimal-mistakes"

# Configurações do tema
minimal_mistakes_skin: "default"  # ou "air", "aqua", "contrast", "dark", "dirt", "neon", "mint", "plum", "sunrise"

# Build settings
include:
  - _pages
  - _posts

# Autor
author:
  name: "Seu Nome"
  avatar: "/assets/images/perfil.jpg"  # opcional
  bio: "Especialista em logística e análise de dados, focado em Python, Power BI e automação"
  location: "Torres Vedras, Portugal"
  email: "seuemail@exemplo.com"
  uri: "https://seunome.github.io"
  github: "seunome"
  linkedin: "seunome"

# Navegação
defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
      read_time: false
      comments: false
      share: false
      related: false

# Navegação principal (menu superior)
nav:
  - title: "Sobre"
    url: /sobre/
  - title: "Projetos"
    url: /projetos/
  - title: "Certificações"
    url: /certificacoes/
  - title: "Contato"
    url: /contato/
